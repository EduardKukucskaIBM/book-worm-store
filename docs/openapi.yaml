openapi: 3.0.3
info:
  title: Book Worm Bookstore API
  version: 1.0.0
  description: >
    Backend REST API specification for Book Worm responsive e-bookstore.
    Provides catalogue browsing, search, author/publisher/category relationships,
    customer authentication, order lifecycle with 48h cancellation, and payment processing.
servers:
  - url: https://api.bookworm.store/v1
    description: Production API Server
  - url: http://localhost:8080/v1
    description: Local Development Server

paths:
  /books:
    get:
      summary: List and search books with filtering and sorting
      description: Retrieve a paginated or filtered list of books matching specified query criteria.
      operationId: getBooks
      parameters:
        - name: category
          in: query
          description: Category ID or slug to filter books by
          required: false
          schema:
            type: string
        - name: publisher
          in: query
          description: Publisher ID to filter books by
          required: false
          schema:
            type: string
        - name: author
          in: query
          description: Author ID to filter books by
          required: false
          schema:
            type: string
        - name: format
          in: query
          description: Book publication format
          required: false
          schema:
            $ref: '#/components/schemas/BookFormat'
        - name: language
          in: query
          description: Publication language (e.g. English, French, Spanish)
          required: false
          schema:
            type: string
        - name: minPrice
          in: query
          description: Minimum price in INR
          required: false
          schema:
            type: number
            minimum: 0
        - name: maxPrice
          in: query
          description: Maximum price in INR
          required: false
          schema:
            type: number
            minimum: 0
        - name: sort
          in: query
          description: Sort ordering
          required: false
          schema:
            $ref: '#/components/schemas/SortOption'
        - name: q
          in: query
          description: Free-text search across title, description, author name, and ISBN
          required: false
          schema:
            type: string
      responses:
        '200':
          description: A list of matching books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

  /books/{id}:
    get:
      summary: Get book details by ID
      description: Returns full book metadata including resolved author, publisher, categories, and reviews.
      operationId: getBookById
      parameters:
        - name: id
          in: path
          required: true
          description: Unique book identifier
          schema:
            type: string
      responses:
        '200':
          description: Complete book detail model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookWithDetails'
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /books/{id}/related:
    get:
      summary: Get related books
      description: Returns curated or category-matched companion books for a given book.
      operationId: getRelatedBooks
      parameters:
        - name: id
          in: path
          required: true
          description: Target book ID
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of related titles to return
          schema:
            type: integer
            default: 4
      responses:
        '200':
          description: List of related books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /books/{id}/reviews:
    get:
      summary: Get reviews for a book
      description: List all customer reviews for the specified book.
      operationId: getBookReviews
      parameters:
        - name: id
          in: path
          required: true
          description: Book ID
          schema:
            type: string
      responses:
        '200':
          description: List of customer reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Submit a review for a book
      description: Post a new star rating and customer review text.
      operationId: createBookReview
      parameters:
        - name: id
          in: path
          required: true
          description: Book ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Review submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          description: Invalid input or rating outside 1-5 range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /categories:
    get:
      summary: List all categories
      description: Retrieve hierarchical category taxonomy (parent and subcategories).
      operationId: getCategories
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'

  /publishers:
    get:
      summary: List all publishers
      description: Retrieve all publishing houses.
      operationId: getPublishers
      responses:
        '200':
          description: List of publishers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Publisher'

  /authors:
    get:
      summary: List all authors
      description: Retrieve authors with biographies and bibliography references.
      operationId: getAuthors
      responses:
        '200':
          description: List of authors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Author'

  /auth/login:
    post:
      summary: Authenticate customer
      description: Validate customer credentials and return user profile with authentication token.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me:
    get:
      summary: Get current authenticated user profile
      description: Returns profile, saved shipping address, and gift points balance for authenticated user.
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders:
    get:
      summary: List customer orders
      description: Retrieve order history for the authenticated user or filtered by user ID.
      operationId: getOrders
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: query
          required: false
          description: Filter orders by user ID (admin or self)
          schema:
            type: string
      responses:
        '200':
          description: List of orders sorted newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a new order
      description: Place an order for logged-in or guest customers.
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order placed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Validation error or invalid pricing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{id}:
    get:
      summary: Get order details by ID
      description: Fetch order details, line items, breakdown, and cancellation eligibility.
      operationId: getOrderById
      parameters:
        - name: id
          in: path
          required: true
          description: Order ID
          schema:
            type: string
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /orders/{id}/cancel:
    post:
      summary: Cancel an eligible order
      description: Cancels an order within its 48-hour cancellation window and triggers gift points refund.
      operationId: cancelOrder
      parameters:
        - name: id
          in: path
          required: true
          description: Order ID
          schema:
            type: string
      responses:
        '200':
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Order not eligible for cancellation (expired window or already delivered)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /payments:
    post:
      summary: Process transaction payment
      description: Process payment against credit/debit card, UPI, or digital wallet.
      operationId: processPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessPaymentInput'
      responses:
        '200':
          description: Payment transaction processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Invalid payment parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /recommendations:
    get:
      summary: Get personalized recommendations
      description: >
        Calculates recommended titles based on user purchase history, favorite authors/categories/publishers,
        or falls back to trending bestsellers.
      operationId: getRecommendations
      parameters:
        - name: userId
          in: query
          required: false
          description: Target user ID for personalized history recommendations
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of titles to recommend
          schema:
            type: integer
            default: 4
      responses:
        '200':
          description: Recommended books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    BookFormat:
      type: string
      enum:
        - Paperback
        - Hardcover
        - eBook

    SortOption:
      type: string
      enum:
        - relevance
        - price-low-high
        - price-high-low
        - rating-high-low
        - newest
        - bestselling

    PaymentMethod:
      type: string
      enum:
        - credit-card
        - debit-card
        - upi
        - wallet

    OrderStatus:
      type: string
      enum:
        - confirmed
        - cancelled
        - delivered

    Address:
      type: object
      required:
        - firstName
        - lastName
        - email
        - phoneCountryCode
        - phone
        - line1
        - city
        - pin
        - state
        - country
      properties:
        firstName:
          type: string
          example: Alex
        lastName:
          type: string
          example: Morgan
        email:
          type: string
          format: email
          example: alex.morgan@example.com
        phoneCountryCode:
          type: string
          example: "+91"
        phone:
          type: string
          example: "9876543210"
        line1:
          type: string
          example: 42 Knowledge Park
        line2:
          type: string
          nullable: true
          example: Sector 5
        city:
          type: string
          example: Bangalore
        pin:
          type: string
          example: "560001"
        state:
          type: string
          example: Karnataka
        country:
          type: string
          example: India

    User:
      type: object
      required:
        - id
        - name
        - email
        - giftPoints
      properties:
        id:
          type: string
          example: user-demo
        name:
          type: string
          example: Demo User
        email:
          type: string
          format: email
          example: demo@bookworm.com
        savedAddress:
          $ref: '#/components/schemas/Address'
        giftPoints:
          type: integer
          minimum: 0
          example: 250

    Author:
      type: object
      required:
        - id
        - name
        - bio
        - bookIds
      properties:
        id:
          type: string
          example: author-1
        name:
          type: string
          example: James Clear
        bio:
          type: string
          example: Specialist in habits, decision-making, and continuous improvement.
        photoUrl:
          type: string
          nullable: true
        bookIds:
          type: array
          items:
            type: string

    Publisher:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          example: pub-1
        name:
          type: string
          example: Penguin Random House
        logoUrl:
          type: string
          nullable: true

    Category:
      type: object
      required:
        - id
        - name
        - slug
      properties:
        id:
          type: string
          example: cat-fiction
        name:
          type: string
          example: Fiction
        parentId:
          type: string
          nullable: true
          example: null
        slug:
          type: string
          example: fiction

    Review:
      type: object
      required:
        - id
        - bookId
        - userName
        - rating
        - text
        - createdAt
      properties:
        id:
          type: string
          example: rev-101
        bookId:
          type: string
          example: book-atomic-habits
        userId:
          type: string
          nullable: true
          example: user-demo
        userName:
          type: string
          example: ReaderX
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        text:
          type: string
          example: Transformative read on forming daily habits.
        createdAt:
          type: string
          format: date-time
          example: '2026-03-01T12:00:00.000Z'

    Book:
      type: object
      required:
        - id
        - title
        - description
        - authorId
        - publisherId
        - categoryIds
        - format
        - language
        - price
        - rating
        - ratingCount
        - copiesSold
        - isBestseller
        - publishedAt
        - relatedBookIds
      properties:
        id:
          type: string
          example: book-atomic-habits
        title:
          type: string
          example: Atomic Habits
        description:
          type: string
          example: An Easy & Proven Way to Build Good Habits & Break Bad Ones.
        longDescription:
          type: string
          nullable: true
        authorId:
          type: string
          example: author-1
        publisherId:
          type: string
          example: pub-1
        categoryIds:
          type: array
          items:
            type: string
          example: ["cat-self-help"]
        format:
          $ref: '#/components/schemas/BookFormat'
        language:
          type: string
          example: English
        price:
          type: number
          example: 499
        coverUrl:
          type: string
          nullable: true
        backCoverUrl:
          type: string
          nullable: true
        isbn:
          type: string
          nullable: true
          example: "978-0735211292"
        rating:
          type: number
          example: 4.8
        ratingCount:
          type: integer
          example: 1250
        copiesSold:
          type: integer
          example: 250000
        isBestseller:
          type: boolean
          example: true
        publishedAt:
          type: string
          format: date
          example: '2018-10-16'
        deliveryDays:
          type: integer
          nullable: true
          example: 3
        relatedBookIds:
          type: array
          items:
            type: string
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/Review'

    BookWithDetails:
      allOf:
        - $ref: '#/components/schemas/Book'
        - type: object
          properties:
            author:
              $ref: '#/components/schemas/Author'
            publisher:
              $ref: '#/components/schemas/Publisher'
            categories:
              type: array
              items:
                $ref: '#/components/schemas/Category'

    OrderItem:
      type: object
      required:
        - bookId
        - title
        - unitPrice
        - quantity
      properties:
        bookId:
          type: string
          example: book-atomic-habits
        title:
          type: string
          example: Atomic Habits
        unitPrice:
          type: number
          example: 499
        quantity:
          type: integer
          minimum: 1
          example: 1

    Order:
      type: object
      required:
        - id
        - userId
        - items
        - shippingAddress
        - subtotal
        - tax
        - deliveryCharges
        - couponDiscount
        - giftPointsRedeemed
        - total
        - paymentMethod
        - status
        - placedAt
        - cancellableUntil
      properties:
        id:
          type: string
          example: ord-1710000000000-a1b2
        userId:
          type: string
          nullable: true
          example: user-demo
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        shippingAddress:
          $ref: '#/components/schemas/Address'
        subtotal:
          type: number
          example: 499
        tax:
          type: number
          example: 59.88
        deliveryCharges:
          type: number
          example: 0
        couponCode:
          type: string
          nullable: true
          example: BOOKWORM100
        couponDiscount:
          type: number
          example: 100
        giftPointsRedeemed:
          type: integer
          example: 50
        total:
          type: number
          example: 408.88
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        cardLast4:
          type: string
          nullable: true
          example: "1111"
        status:
          $ref: '#/components/schemas/OrderStatus'
        placedAt:
          type: string
          format: date-time
          example: '2026-03-01T10:00:00.000Z'
        cancellableUntil:
          type: string
          format: date-time
          example: '2026-03-03T10:00:00.000Z'
        estimatedDelivery:
          type: string
          format: date-time
          nullable: true

    PriceBreakdown:
      type: object
      required:
        - subtotal
        - tax
        - deliveryCharges
        - couponDiscount
        - giftPointsDiscount
        - giftPointsRedeemed
        - total
        - itemCount
      properties:
        subtotal:
          type: number
          example: 499
        tax:
          type: number
          example: 59.88
        deliveryCharges:
          type: number
          example: 0
        couponDiscount:
          type: number
          example: 100
        giftPointsDiscount:
          type: number
          example: 50
        giftPointsRedeemed:
          type: integer
          example: 50
        total:
          type: number
          example: 408.88
        itemCount:
          type: integer
          example: 1

    CreateReviewRequest:
      type: object
      required:
        - rating
        - text
        - userName
      properties:
        userId:
          type: string
          nullable: true
        userName:
          type: string
          example: Alex M.
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        text:
          type: string
          maxLength: 500
          example: Highly recommended for all readers.

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: demo@bookworm.com
        password:
          type: string
          example: bookworm123

    LoginResponse:
      type: object
      required:
        - user
        - token
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    CreateOrderRequest:
      type: object
      required:
        - items
        - shippingAddress
        - subtotal
        - tax
        - deliveryCharges
        - couponDiscount
        - giftPointsRedeemed
        - total
        - paymentMethod
      properties:
        userId:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        shippingAddress:
          $ref: '#/components/schemas/Address'
        subtotal:
          type: number
        tax:
          type: number
        deliveryCharges:
          type: number
        couponCode:
          type: string
          nullable: true
        couponDiscount:
          type: number
        giftPointsRedeemed:
          type: integer
        total:
          type: number
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        cardLast4:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/OrderStatus'
          default: confirmed
        estimatedDelivery:
          type: string
          format: date-time
          nullable: true

    ProcessPaymentInput:
      type: object
      required:
        - method
        - amount
      properties:
        method:
          $ref: '#/components/schemas/PaymentMethod'
        amount:
          type: number
          example: 408.88
        cardDetails:
          type: object
          properties:
            cardNumber:
              type: string
              example: "4111111111111111"
            cardHolder:
              type: string
              example: Alex Morgan
            expiry:
              type: string
              example: "12/2028"
            cvv:
              type: string
              example: "123"
        upiId:
          type: string
          example: "alex@oksbi"
        walletName:
          type: string
          example: "amazon-pay"
        simulateFailure:
          type: boolean
          default: false

    PaymentResponse:
      type: object
      required:
        - success
        - transactionId
        - method
        - amount
      properties:
        success:
          type: boolean
          example: true
        transactionId:
          type: string
          example: tx-1710000000000-xyz123
        method:
          $ref: '#/components/schemas/PaymentMethod'
        amount:
          type: number
          example: 408.88
        message:
          type: string
          example: Payment received successfully

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Resource not found or operation not permitted
        code:
          type: string
          example: NOT_FOUND
